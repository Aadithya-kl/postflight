<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var saved = localStorage.getItem('color-scheme');
        if (saved === 'light' || saved === 'dark') {
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.setAttribute('content', saved);
        }
      } catch (_) {}
    </script>
    <title>PostFlight — Pre-publish checks for social media</title>
    <meta
      name="description"
      content="Check posts, preview mobile folds and video safe zones, adapt copy across 9 social platforms, and verify links locally before publishing."
    />
    <link
      rel="icon"
      type="image/svg+xml"

    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
