<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="ftitle fdesc">
  <title id="ftitle">The LinkedIn blank-line fold trap</title>
  <desc id="fdesc">Side-by-side mobile previews. On the left, two blank lines push the hook below the "…see more" cutoff. On the right, the same copy without blank lines keeps the hook and the call to action visible.</desc>
  <style>
    .bg     { fill: #ffffff; }
    .phone  { fill: #f8fafc; stroke: #cbd5e1; }
    .t      { fill: #0f172a; font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .t-dim  { fill: #64748b; font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .bad    { fill: #c43e1c; }
    .good   { fill: #137547; }
    .badbox { fill: #fef2f2; stroke: #c43e1c; }
    .goodbox{ fill: #f0fdf4; stroke: #137547; }
    .foldln { stroke: #c43e1c; }
    .foldok { stroke: #137547; }
    .txtln  { fill: #cbd5e1; }
    .txtln-hook { fill: #0d5e99; }
    .avatar { fill: #cbd5e1; }
    .h      { font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg     { fill: #0d1117; }
      .phone  { fill: #161b22; stroke: #30363d; }
      .t      { fill: #e6edf3; }
      .t-dim  { fill: #8b949e; }
      .bad    { fill: #f85149; }
      .good   { fill: #3fb950; }
      .badbox { fill: #2d1012; stroke: #f85149; }
      .goodbox{ fill: #0d2b1e; stroke: #3fb950; }
      .foldln { stroke: #f85149; }
      .foldok { stroke: #3fb950; }
      .txtln  { fill: #30363d; }
      .txtln-hook { fill: #58a6ff; }
      .avatar { fill: #30363d; }
    }
  </style>

  <rect class="bg" width="900" height="420" rx="8"/>

  <text class="t h" x="40" y="36" font-size="15">LinkedIn mobile fold · the blank-line trap</text>
  <text class="t-dim" x="40" y="58" font-size="12">A blank line consumes a whole visible line. Mobile shows 3 lines text-only, 2 with media — so two taps of Enter can bury your hook.</text>

  <!-- ============ BAD ============ -->
  <rect class="badbox" x="40" y="86" width="390" height="286" rx="10" stroke-width="1.5"/>
  <text class="bad h mono" x="60" y="112" font-size="12">✕  WITH BLANK LINES</text>

  <rect class="phone" x="60" y="126" width="350" height="186" rx="8" stroke-width="1"/>
  <circle class="avatar" cx="84" cy="150" r="11"/>
  <rect class="txtln" x="103" y="144" width="86" height="6" rx="3"/>
  <rect class="txtln" x="103" y="155" width="54" height="5" rx="2.5"/>

  <!-- visible line 1: text -->
  <rect class="txtln-hook" x="76" y="176" width="300" height="7" rx="3.5"/>
  <!-- visible line 2: BLANK (wasted) -->
  <rect class="badbox" x="76" y="193" width="300" height="12" rx="3" stroke-width="1" stroke-dasharray="3 3"/>
  <text class="bad mono" x="226" y="202" font-size="8.5" text-anchor="middle">blank line — 1 full line burned</text>
  <!-- visible line 3: BLANK (wasted) -->
  <rect class="badbox" x="76" y="211" width="300" height="12" rx="3" stroke-width="1" stroke-dasharray="3 3"/>
  <text class="bad mono" x="226" y="220" font-size="8.5" text-anchor="middle">blank line — 1 full line burned</text>

  <!-- fold -->
  <line class="foldln" x1="68" y1="233" x2="402" y2="233" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="bad mono" x="76" y="247" font-size="9.5">…see more  ← fold</text>

  <!-- below fold -->
  <rect class="txtln" x="76" y="258" width="300" height="7" rx="3.5" opacity="0.55"/>
  <rect class="txtln" x="76" y="273" width="258" height="7" rx="3.5" opacity="0.55"/>
  <rect class="txtln" x="76" y="288" width="180" height="7" rx="3.5" opacity="0.55"/>

  <text class="bad mono h" x="60" y="336" font-size="11">Hook + #Ad hidden below the fold</text>
  <text class="t-dim mono" x="60" y="354" font-size="10">fold/blank-line-starvation · compliance/ftc-below-fold</text>

  <!-- ============ GOOD ============ -->
  <rect class="goodbox" x="470" y="86" width="390" height="286" rx="10" stroke-width="1.5"/>
  <text class="good h mono" x="490" y="112" font-size="12">✓  AFTER postflight check --fix</text>

  <rect class="phone" x="490" y="126" width="350" height="186" rx="8" stroke-width="1"/>
  <circle class="avatar" cx="514" cy="150" r="11"/>
  <rect class="txtln" x="533" y="144" width="86" height="6" rx="3"/>
  <rect class="txtln" x="533" y="155" width="54" height="5" rx="2.5"/>

  <rect class="txtln-hook" x="506" y="176" width="300" height="7" rx="3.5"/>
  <rect class="txtln-hook" x="506" y="193" width="300" height="7" rx="3.5"/>
  <rect class="txtln-hook" x="506" y="210" width="232" height="7" rx="3.5"/>
  <text class="good mono" x="748" y="217" font-size="9">#Ad</text>

  <line class="foldok" x1="498" y1="233" x2="832" y2="233" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="good mono" x="506" y="247" font-size="9.5">…see more  ← fold</text>

  <rect class="txtln" x="506" y="258" width="300" height="7" rx="3.5" opacity="0.55"/>
  <rect class="txtln" x="506" y="273" width="258" height="7" rx="3.5" opacity="0.55"/>
  <rect class="txtln" x="506" y="288" width="180" height="7" rx="3.5" opacity="0.55"/>

  <text class="good mono h" x="490" y="336" font-size="11">3 full lines of hook + disclosure above the fold</text>
  <text class="t-dim mono" x="490" y="354" font-size="10">FTC 16 CFR Part 255 satisfied · reach preserved</text>

  <text class="t-dim mono" x="40" y="400" font-size="10.5">postflight check draft.md --targets linkedin</text>
</svg>
